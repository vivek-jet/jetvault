# JetVault production stack: JetVault (Vaultwarden) behind Caddy with automatic HTTPS.
# Lives in /opt/jetvault on the server; see jetvault/deploy/README.md.
services:
  jetvault:
    image: ${JETVAULT_IMAGE:-ghcr.io/vivek-jet/jetvault:latest}
    container_name: jetvault
    restart: unless-stopped
    env_file: .env
    environment:
      DOMAIN: https://${JETVAULT_HOSTNAME}
      IP_HEADER: X-Real-IP
    volumes:
      - ./data:/data
    expose:
      - "80"

  caddy:
    image: docker.io/library/caddy:2
    container_name: jetvault-caddy
    restart: unless-stopped
    environment:
      JETVAULT_HOSTNAME: ${JETVAULT_HOSTNAME}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jetvault

volumes:
  caddy_data:
  caddy_config:
